services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: zeromttr-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
      - '--storage.tsdb.retention.time=24h'
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    expose:
      - '9090'
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:9090/-/healthy || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - aiops-net

  loki:
    image: grafana/loki:3.2.1
    container_name: zeromttr-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki-config.yaml:/etc/loki/local-config.yaml:ro
    expose:
      - '3100'
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3100/ready || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - aiops-net

  tempo:
    image: grafana/tempo:2.6.1
    container_name: zeromttr-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./infra/tempo-config.yaml:/etc/tempo.yaml:ro
    expose:
      - '3200'
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3200/ready || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - aiops-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: zeromttr-grafana
    restart: unless-stopped
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GRAFANA_WEBHOOK_TOKEN=${GRAFANA_WEBHOOK_TOKEN}
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - aiops-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: zeromttr-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./infra/otel-collector-config.prod.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - '4317'
      - '4318'
      - '13133'
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD', '/otelcol-contrib', 'validate', '--config=/etc/otelcol-contrib/config.yaml']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - aiops-net

  postgres:
    image: postgres:16-alpine
    container_name: zeromttr-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-zeromttr}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-payments}
    expose:
      - '5432'
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-zeromttr} -d ${POSTGRES_DB:-payments} || exit 1'
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - aiops-net

  mcp-server:
    image: ghcr.io/admilsongoncalves/zeromttr/mcp-server:${IMAGE_TAG:-latest}
    container_name: zeromttr-mcp-server
    restart: unless-stopped
    expose:
      - '8000'
    deploy:
      resources:
        limits:
          memory: 192M
    environment:
      - MCP_PORT=8000
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - TEMPO_URL=http://tempo:3200
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - aiops-net

  orchestrator:
    image: ghcr.io/admilsongoncalves/zeromttr/orchestrator:${IMAGE_TAG:-latest}
    container_name: zeromttr-orchestrator
    restart: unless-stopped
    expose:
      - '8080'
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - PORT=8080
      - GRAFANA_WEBHOOK_TOKEN=${GRAFANA_WEBHOOK_TOKEN}
      - DASHBOARD_API_TOKEN=${DASHBOARD_API_TOKEN}
      - MCP_URL=http://mcp-server:8000
      - TARGET_DEMO_URL=http://target-app-demo:3001
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash}
      - LLM_API_KEY=${LLM_API_KEY}
      - DECISION_HMAC_SECRET=${DECISION_HMAC_SECRET}
      - LIVE_DEMO_KEY=${LIVE_DEMO_KEY}
      - SIMULATION_COOLDOWN_MS=${SIMULATION_COOLDOWN_MS:-120000}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=${RESEND_FROM}
      - ON_CALL_ENGINEER_EMAIL=${ON_CALL_ENGINEER_EMAIL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - TARGET_GITHUB_REPO=${TARGET_GITHUB_REPO}
      - TARGET_BASE_BRANCH=${TARGET_BASE_BRANCH}
      - TARGET_SERVICE_PATH=${TARGET_SERVICE_PATH}
    depends_on:
      - mcp-server
    networks:
      - aiops-net

  target-app-demo:
    image: ghcr.io/admilsongoncalves/zeromttr/target-app-demo:${IMAGE_TAG:-latest}
    container_name: zeromttr-target-app-demo
    restart: unless-stopped
    expose:
      - '3001'
    deploy:
      resources:
        limits:
          memory: 192M
    environment:
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-zeromttr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-payments}}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - CHAOS_ENABLED=${CHAOS_ENABLED:-true}
      - DEMO_MODE=${DEMO_MODE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    networks:
      - aiops-net

  dashboard:
    image: ghcr.io/admilsongoncalves/zeromttr/dashboard:${IMAGE_TAG:-latest}
    container_name: zeromttr-dashboard
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      - DASHBOARD_API_TOKEN=${DASHBOARD_API_TOKEN}
    depends_on:
      - orchestrator
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.zeromttr.rule=Host(`${ZEROMTTR_DOMAIN}`)'
      - 'traefik.http.routers.zeromttr.entrypoints=websecure'
      - 'traefik.http.routers.zeromttr.tls.certresolver=letsencrypt'
      - 'traefik.http.services.zeromttr.loadbalancer.server.port=80'
    networks:
      - aiops-net
      - traefik_public

networks:
  aiops-net:
    driver: bridge
  traefik_public:
    external: true
    name: ${TRAEFIK_NETWORK_NAME:-traefik_default}
