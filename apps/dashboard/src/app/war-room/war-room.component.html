<p-toast position="top-right" />
<div
  class="min-h-dvh lg:h-full lg:max-h-full bg-slate-950 text-slate-100 font-sans p-2 sm:p-2.5 flex flex-col gap-2 lg:overflow-hidden"
>
  <app-war-room-header
    [demoModeEnabled]="incidentService.demoModeEnabled()"
    [sseConnected]="incidentService.sseConnected()"
    [targetStatus]="incidentService.targetStatus()"
    [activeMode]="incidentService.activeMode()"
    [isWorkflowRunning]="incidentService.isWorkflowRunning()"
    [liveDemoKey]="incidentService.liveDemoKey()"
    [requireDemoKey]="incidentService.requireDemoKey()"
    [simulationLockedByTurnstile]="incidentService.isSimulationLockedByTurnstile()"
    [healthyTrafficActive]="incidentService.targetMetrics()?.healthyTrafficActive ?? false"
    [isTogglingTraffic]="incidentService.isTogglingTraffic()"
    [isResetting]="incidentService.isResetting()"
    [isSimulating]="incidentService.isSimulating()"
    (modeChange)="onModeChange($event)"
    (liveKeyChange)="onLiveKeyChange($event)"
    (langChange)="onLangChange($event)"
    (toggleHealthyTraffic)="onToggleHealthyTraffic()"
    (triggerChaos)="onTriggerChaos()"
    (resetService)="onResetService()"
  />

  <app-war-room-notices
    [demoModeEnabled]="incidentService.demoModeEnabled()"
    [activeMode]="incidentService.activeMode()"
    [turnstileSiteKey]="incidentService.turnstileSiteKey()"
    [simulationLockedByTurnstile]="incidentService.isSimulationLockedByTurnstile()"
    [turnstileResetTrigger]="incidentService.turnstileResetCounter()"
    (turnstileTokenChange)="onTurnstileTokenChange($event)"
  />

  <app-fsm-timeline
    [stages]="incidentService.fsmStages()"
    [hintKey]="incidentService.fsmHintKey()"
    [liveWaitSeconds]="incidentService.liveWaitSeconds()"
  />

  <app-target-telemetry
    [metrics]="incidentService.targetMetrics()"
    [serviceName]="incidentService.targetServiceName()"
  />

  <app-war-room-kpis
    [ttdDisplay]="incidentService.ttdDisplay()"
    [ttprDisplay]="incidentService.ttprDisplay()"
    [signalsRatio]="incidentService.signalsRatio()"
    [evidenceCoveragePercent]="incidentService.evidenceCoveragePercent()"
    [reasoningSource]="incidentService.reasoningSource()"
    [finopsReduction]="incidentService.finopsReduction()"
    [estimatedTokensSaved]="incidentService.estimatedTokensSaved()"
  />

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-2.5 flex-1 min-h-0">
    <app-evidence-panel
      class="lg:col-span-8 flex flex-col min-h-[360px] lg:min-h-0"
      [incident]="incidentService.currentIncident()"
      [targetStatus]="incidentService.targetStatus()"
      [telemetryHistory]="incidentService.telemetryHistory()"
      [signalsRatio]="incidentService.signalsRatio()"
      [evidenceCoveragePercent]="incidentService.evidenceCoveragePercent()"
      [isPiiPassed]="incidentService.isPiiPassed()"
      [leakedPatternsCount]="incidentService.leakedPatternsCount()"
      [finopsReduction]="incidentService.finopsReduction()"
      [estimatedTokensSaved]="incidentService.estimatedTokensSaved()"
    />

    <app-remediation-panel
      class="lg:col-span-4 flex flex-col min-h-[280px] lg:min-h-0"
      [demoModeEnabled]="incidentService.demoModeEnabled()"
      [incident]="incidentService.currentIncident()"
      [displayedFsmState]="incidentService.displayedFsmState()"
      [simulationLockedByTurnstile]="incidentService.isSimulationLockedByTurnstile()"
      (simulateDecision)="onSimulateDecision()"
    />
  </div>
</div>
