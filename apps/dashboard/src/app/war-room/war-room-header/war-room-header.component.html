<header
  class="shrink-0 bg-slate-900 border border-slate-800 rounded-lg px-2.5 sm:px-3 py-2 shadow-md"
>
  <div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-2 min-w-0">
    <!-- Brand & Live Service Status -->
    <div class="flex items-center gap-2.5 min-w-0 flex-1 basis-[280px]">
      <i class="pi pi-shield text-cyan-400 text-xl shrink-0" aria-hidden="true"></i>
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-1.5 min-w-0">
          <h1 class="text-sm font-bold text-white tracking-wide truncate">
            {{ i18n.t('appTitle') }}
          </h1>
          <p-tag
            [value]="sseConnectedSignal() ? i18n.t('sseConnected') : i18n.t('sseOffline')"
            [severity]="sseConnectedSignal() ? 'success' : 'danger'"
            styleClass="text-[10px] py-0 shrink-0"
          />
          @if (targetStatusSignal(); as ts) {
            <p-tag
              [value]="
                ts.service +
                ': ' +
                (ts.status === healthStatus.HEALTHY ? i18n.t('healthy') : i18n.t('degraded')) +
                ' (' +
                ts.version +
                ')'
              "
              [severity]="ts.status === healthStatus.HEALTHY ? 'success' : 'warn'"
              styleClass="text-[10px] py-0 shrink-0"
            />
          } @else {
            <p-tag
              [value]="i18n.t('targetStatusUnknown')"
              severity="secondary"
              styleClass="text-[10px] py-0 shrink-0"
            />
          }
        </div>
        <p class="hidden sm:block text-[11px] text-slate-400 truncate">
          {{ i18n.t('appSubtitle') }}
        </p>
      </div>
    </div>

    <!-- Mobile Menu Toggle + Always-Available Language Switcher -->
    <div class="flex items-center gap-1.5 shrink-0 md:order-3">
      @if (demoModeEnabledSignal()) {
        <button
          type="button"
          class="md:hidden inline-flex items-center gap-1.5 h-8 px-2.5 rounded-md border border-slate-700 bg-slate-950 text-xs font-medium text-slate-200 hover:border-cyan-500/70 focus-visible:outline focus-visible:outline-2 focus-visible:outline-cyan-400 cursor-pointer shrink-0 transition-colors"
          [attr.aria-expanded]="isMobileMenuOpenSignal()"
          aria-controls="war-room-header-menu"
          [attr.aria-label]="i18n.t('headerMenuAriaLabel')"
          (click)="toggleMobileMenu()"
        >
          <i
            class="pi text-xs"
            [ngClass]="isMobileMenuOpenSignal() ? 'pi-times' : 'pi-bars'"
            aria-hidden="true"
          ></i>
          <span>{{ i18n.t('headerMenuBtn') }}</span>
        </button>
      }

      <app-locale-switcher [currentLang]="i18n.currentLang()" (langChange)="onLangSelect($event)" />
    </div>

    <!-- Modular Main Menu (Collapsible on narrow screens, hidden when ENABLE_DEMO_MODE=false) -->
    @if (demoModeEnabledSignal()) {
      <nav
        id="war-room-header-menu"
        [attr.aria-label]="i18n.t('headerMenuAriaLabel')"
        [ngClass]="isMobileMenuOpenSignal() ? 'flex' : 'hidden md:flex'"
        class="w-full md:w-auto md:order-2 flex-wrap items-center justify-start md:justify-end min-w-0 pt-2 md:pt-0 border-t border-slate-800/80 md:border-t-0"
      >
        <app-main-menu
          [demoModeEnabled]="demoModeEnabledSignal()"
          [targetStatus]="targetStatusSignal()"
          [activeMode]="activeModeSignal()"
          [isWorkflowRunning]="isWorkflowRunningSignal()"
          [liveDemoKey]="liveDemoKeySignal()"
          [requireDemoKey]="requireDemoKeySignal()"
          [simulationLockedByTurnstile]="simulationLockedByTurnstileSignal()"
          [healthyTrafficActive]="healthyTrafficActiveSignal()"
          [isTogglingTraffic]="isTogglingTrafficSignal()"
          [isResetting]="isResettingSignal()"
          [isSimulating]="isSimulatingSignal()"
          (modeChange)="modeChange.emit($event)"
          (liveKeyChange)="liveKeyChange.emit($event)"
          (toggleHealthyTraffic)="toggleHealthyTraffic.emit()"
          (triggerChaos)="triggerChaos.emit()"
          (resetService)="resetService.emit()"
        />
      </nav>
    }
  </div>
</header>
