<header
  class="shrink-0 bg-slate-900 border border-slate-800 rounded-lg px-2.5 sm:px-3 py-2 shadow-md"
>
  <div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-2 min-w-0">
    <!-- Brand & Live Service Status -->
    <div class="flex items-center gap-2.5 min-w-0 flex-1 basis-[280px]">
      <i class="pi pi-shield text-cyan-400 text-xl shrink-0" aria-hidden="true"></i>
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-1.5 min-w-0">
          <h1 class="text-sm font-bold text-white tracking-wide truncate">
            {{ i18n.t('appTitle') }}
          </h1>
          <p-tag
            [value]="sseConnectedSignal() ? 'SSE Connected' : 'SSE Offline'"
            [severity]="sseConnectedSignal() ? 'success' : 'danger'"
            styleClass="text-[10px] py-0 shrink-0"
          />
          @if (targetStatusSignal(); as ts) {
            <p-tag
              [value]="
                ts.service +
                ': ' +
                (ts.status === 'healthy' ? i18n.t('healthy') : i18n.t('degraded')) +
                ' (' +
                ts.version +
                ')'
              "
              [severity]="ts.status === 'healthy' ? 'success' : 'warn'"
              styleClass="text-[10px] py-0 shrink-0"
            />
          } @else {
            <p-tag value="Target: --" severity="secondary" styleClass="text-[10px] py-0 shrink-0" />
          }
        </div>
        <p class="hidden sm:block text-[11px] text-slate-400 truncate">
          {{ i18n.t('appSubtitle') }}
        </p>
      </div>
    </div>

    <!-- Mobile Command Menu Toggle -->
    <button
      type="button"
      class="md:hidden inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded border border-slate-700 bg-slate-950 text-xs font-medium text-slate-200 hover:border-cyan-500/70 focus-visible:outline focus-visible:outline-2 focus-visible:outline-cyan-400 cursor-pointer shrink-0"
      [attr.aria-expanded]="isMobileMenuOpenSignal()"
      aria-controls="war-room-header-menu"
      [attr.aria-label]="i18n.t('headerMenuAriaLabel')"
      (click)="toggleMobileMenu()"
    >
      <i
        class="pi text-xs"
        [ngClass]="isMobileMenuOpenSignal() ? 'pi-times' : 'pi-bars'"
        aria-hidden="true"
      ></i>
      <span>{{ i18n.t('headerMenuBtn') }}</span>
    </button>

    <!-- Command Menu & Language Controls -->
    <nav
      id="war-room-header-menu"
      [attr.aria-label]="i18n.t('headerMenuAriaLabel')"
      [ngClass]="isMobileMenuOpenSignal() ? 'flex' : 'hidden md:flex'"
      class="w-full md:w-auto flex-wrap items-center justify-start md:justify-end gap-1.5 min-w-0 pt-2 md:pt-0 border-t border-slate-800/80 md:border-t-0"
    >
      <p-selectbutton
        [options]="modeOptions"
        [ngModel]="activeModeSignal()"
        (ngModelChange)="onModeSelect($event)"
        [disabled]="isWorkflowRunningSignal()"
        optionLabel="label"
        optionValue="value"
        [pTooltip]="i18n.t('tooltipModeSelector')"
        tooltipPosition="bottom"
        styleClass="text-[10px]"
      />

      @if (activeModeSignal() === 'live' && !publicLiveDemoSignal()) {
        <form (submit)="$event.preventDefault()" class="inline-flex m-0 p-0">
          <input
            type="text"
            autocomplete="username"
            value="zeromttr-live-demo"
            readonly
            tabindex="-1"
            aria-hidden="true"
            class="sr-only"
          />
          <input
            type="password"
            autocomplete="current-password"
            [placeholder]="i18n.t('liveKeyPlaceholder')"
            [value]="liveDemoKeySignal()"
            [disabled]="isWorkflowRunningSignal()"
            (input)="onLiveKeyInput($event)"
            [pTooltip]="i18n.t('tooltipLiveKeyInput')"
            tooltipPosition="bottom"
            class="bg-slate-950 border border-slate-700 rounded px-2 py-0.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 w-32 disabled:opacity-50 disabled:cursor-not-allowed"
          />
        </form>
      }

      @if (activeModeSignal() === 'live') {
        <p-button
          [label]="
            healthyTrafficActiveSignal()
              ? i18n.t('healthyTrafficStopBtn')
              : i18n.t('healthyTrafficStartBtn')
          "
          [severity]="healthyTrafficActiveSignal() ? 'warn' : 'success'"
          size="small"
          [disabled]="
            isTogglingTrafficSignal() ||
            simulationLockedByTurnstileSignal() ||
            isHealthyTrafficStartBlockedSignal()
          "
          (onClick)="toggleHealthyTraffic.emit()"
          [pTooltip]="
            simulationLockedByTurnstileSignal()
              ? i18n.t('tooltipTurnstilePending')
              : isHealthyTrafficStartBlockedSignal()
                ? i18n.t('tooltipHealthyTrafficRequiresRestore')
                : i18n.t('tooltipHealthyTraffic')
          "
          tooltipPosition="bottom"
          styleClass="text-xs py-1"
        />
      }

      <p-button
        [label]="i18n.t('simulateIncident')"
        severity="danger"
        size="small"
        [disabled]="isWorkflowRunningSignal() || simulationLockedByTurnstileSignal()"
        (onClick)="triggerChaos.emit()"
        [pTooltip]="
          simulationLockedByTurnstileSignal()
            ? i18n.t('tooltipTurnstilePending')
            : i18n.t('tooltipSimulateIncident')
        "
        tooltipPosition="bottom"
        styleClass="text-xs py-1"
      />

      <p-button
        [label]="i18n.t('restoreService')"
        severity="secondary"
        size="small"
        [disabled]="
          isResettingSignal() || isSimulatingSignal() || simulationLockedByTurnstileSignal()
        "
        (onClick)="resetService.emit()"
        [pTooltip]="
          simulationLockedByTurnstileSignal()
            ? i18n.t('tooltipTurnstilePending')
            : i18n.t('tooltipRestoreService')
        "
        tooltipPosition="bottom"
        styleClass="text-xs py-1"
      />

      <app-locale-switcher [currentLang]="i18n.currentLang()" (langChange)="onLangSelect($event)" />
    </nav>
  </div>
</header>
