<div class="flex flex-col gap-2.5 pt-1.5">
  @if (telemetryHistorySignal().length === 0) {
    <div
      class="bg-slate-950 border border-slate-800 rounded p-6 text-center text-xs text-slate-400 font-mono"
    >
      <i class="pi pi-spin pi-spinner mr-2 text-cyan-400"></i>
      <span>{{ i18n.t('chartAwaitingSamples') }}</span>
    </div>
  } @else {
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <!-- Chart A: p95 Latency & 5xx Error Rate -->
      <figure class="bg-slate-950 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 m-0">
        <figcaption class="flex items-center justify-between text-xs">
          <span class="font-bold text-slate-200">{{ i18n.t('chartLatencyErrorTitle') }}</span>
          <span class="font-mono text-[11px] text-amber-300">
            {{ latencyTimeSeries().max }}ms ·
            {{ errorTimeSeries().points[errorTimeSeries().points.length - 1]?.value ?? 0 }}%
          </span>
        </figcaption>
        <svg
          role="img"
          viewBox="0 0 420 145"
          class="w-full h-40 sm:h-44 bg-slate-900/60 rounded border border-slate-800/80"
        >
          <title>{{ i18n.t('chartLatencyErrorTitle') }}</title>
          @for (tick of latencyTimeSeries().yTicks; track tick.y) {
            <line
              x1="6"
              x2="414"
              [attr.y1]="tick.y"
              [attr.y2]="tick.y"
              stroke="#1e293b"
              stroke-width="1"
            />
            <text x="10" [attr.y]="tick.y + 9" class="fill-slate-500 text-[9px] font-mono">
              {{ tick.label }}
            </text>
          }
          <path [attr.d]="latencyTimeSeries().areaPath" fill="#f59e0b" fill-opacity="0.16" />
          <path
            [attr.d]="latencyTimeSeries().linePath"
            fill="none"
            stroke="#fbbf24"
            stroke-width="2"
          />
          <path [attr.d]="errorTimeSeries().areaPath" fill="#f43f5e" fill-opacity="0.14" />
          <path
            [attr.d]="errorTimeSeries().linePath"
            fill="none"
            stroke="#fb7185"
            stroke-width="1.75"
            stroke-dasharray="4 2"
          />
          @for (pt of latencyTimeSeries().points; track $index) {
            <circle [attr.cx]="pt.x" [attr.cy]="pt.y" r="2.2" fill="#fbbf24" />
          }
        </svg>
        <div class="flex items-center justify-between text-[10px] font-mono text-slate-400">
          <span class="flex items-center gap-2.5">
            <span class="inline-flex items-center gap-1 text-amber-300">
              <span class="w-2.5 h-0.5 bg-amber-400 inline-block"></span> p95 (ms)
            </span>
            <span class="inline-flex items-center gap-1 text-rose-300">
              <span class="w-2.5 h-0.5 bg-rose-400 inline-block"></span> 5xx (%)
            </span>
          </span>
          <span>
            {{ latencyTimeSeries().xLabels[0]?.label }} →
            {{ latencyTimeSeries().xLabels[latencyTimeSeries().xLabels.length - 1]?.label }}
          </span>
        </div>
      </figure>

      <!-- Chart B: Throughput Req/s & Pool Usage -->
      <figure class="bg-slate-950 border border-slate-800 rounded-lg p-3 flex flex-col gap-2 m-0">
        <figcaption class="flex items-center justify-between text-xs">
          <span class="font-bold text-slate-200">{{ i18n.t('chartThroughputPoolTitle') }}</span>
          <span class="font-mono text-[11px] text-cyan-300">
            {{
              throughputTimeSeries().points[throughputTimeSeries().points.length - 1]?.value ?? 0
            }}
            rps
          </span>
        </figcaption>
        <svg
          role="img"
          viewBox="0 0 420 145"
          class="w-full h-40 sm:h-44 bg-slate-900/60 rounded border border-slate-800/80"
        >
          <title>{{ i18n.t('chartThroughputPoolTitle') }}</title>
          @for (tick of throughputTimeSeries().yTicks; track tick.y) {
            <line
              x1="6"
              x2="414"
              [attr.y1]="tick.y"
              [attr.y2]="tick.y"
              stroke="#1e293b"
              stroke-width="1"
            />
            <text x="10" [attr.y]="tick.y + 9" class="fill-slate-500 text-[9px] font-mono">
              {{ tick.label }}
            </text>
          }
          <path [attr.d]="throughputTimeSeries().areaPath" fill="#06b6d4" fill-opacity="0.18" />
          <path
            [attr.d]="throughputTimeSeries().linePath"
            fill="none"
            stroke="#22d3ee"
            stroke-width="2"
          />
          <path [attr.d]="poolTimeSeries().areaPath" fill="#10b981" fill-opacity="0.14" />
          <path
            [attr.d]="poolTimeSeries().linePath"
            fill="none"
            stroke="#34d399"
            stroke-width="1.75"
          />
          @for (pt of throughputTimeSeries().points; track $index) {
            <circle [attr.cx]="pt.x" [attr.cy]="pt.y" r="2.2" fill="#22d3ee" />
          }
        </svg>
        <div class="flex items-center justify-between text-[10px] font-mono text-slate-400">
          <span class="flex items-center gap-2.5">
            <span class="inline-flex items-center gap-1 text-cyan-300">
              <span class="w-2.5 h-0.5 bg-cyan-400 inline-block"></span> Req/s
            </span>
            <span class="inline-flex items-center gap-1 text-emerald-300">
              <span class="w-2.5 h-0.5 bg-emerald-400 inline-block"></span> Pool Conn
            </span>
          </span>
          <span>
            {{ throughputTimeSeries().xLabels[0]?.label }} →
            {{ throughputTimeSeries().xLabels[throughputTimeSeries().xLabels.length - 1]?.label }}
          </span>
        </div>
      </figure>
    </div>
  }
</div>
