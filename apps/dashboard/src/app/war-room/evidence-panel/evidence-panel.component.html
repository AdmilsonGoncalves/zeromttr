<section
  class="flex-1 bg-slate-900 border border-slate-800 rounded-lg p-2.5 flex flex-col min-h-0 shadow-md"
>
  <p-tabs
    [value]="activeTab()"
    (valueChange)="onTabChange($event)"
    class="flex flex-col flex-1 min-h-0"
  >
    <p-tablist class="shrink-0">
      <p-tab value="0"><i class="pi pi-chart-line mr-1"></i> {{ i18n.t('tabLiveMetrics') }}</p-tab>
      <p-tab value="1"><i class="pi pi-sitemap mr-1"></i> {{ i18n.t('tabTraceTree') }}</p-tab>
      <p-tab value="2"><i class="pi pi-shield mr-1"></i> {{ i18n.t('tabLokiLogs') }}</p-tab>
      <p-tab value="3"><i class="pi pi-file-edit mr-1"></i> {{ i18n.t('tabGitDiff') }}</p-tab>
    </p-tablist>

    <p-tabpanels class="flex-1 min-h-0 overflow-y-auto pr-1">
      <p-tabpanel value="0">
        <app-live-metrics-tab [telemetryHistory]="telemetryHistorySignal()" />
      </p-tabpanel>

      <p-tabpanel value="1">
        <app-trace-tree-tab
          [incident]="incidentSignal()"
          [signalsRatio]="signalsRatioSignal()"
          [evidenceCoveragePercent]="evidenceCoveragePercentSignal()"
        />
      </p-tabpanel>

      <p-tabpanel value="2">
        <app-loki-pii-tab
          [incident]="incidentSignal()"
          [targetStatus]="targetStatusSignal()"
          [isPiiPassed]="isPiiPassedSignal()"
          [leakedPatternsCount]="leakedPatternsCountSignal()"
        />
      </p-tabpanel>

      <p-tabpanel value="3">
        <app-git-diff-finops-tab
          [incident]="incidentSignal()"
          [finopsReduction]="finopsReductionSignal()"
          [estimatedTokensSaved]="estimatedTokensSavedSignal()"
        />
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</section>
